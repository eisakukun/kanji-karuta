<script type="module">
"use strict";
import { FilesetResolver, HandLandmarker }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const view = $("view"), vctx = view.getContext("2d");
const vid = $("vid"), gate = $("gate"), msg = $("msg"), dbg = $("hintbar");
const hud = $("hud"), scMe = $("scMe"), scOp = $("scOp"), qnEl = $("qn");
const opWrap = $("opWrap"), opVid = $("opVid");

const mir = document.createElement("canvas");
const mctx = mir.getContext("2d", { willReadFrequently: true });

/* ================= 音 =================
   叩く音は録音素材ではなくWebAudioで合成する（外部ファイル不要・著作権フリー・
   速度に応じて強さを変えられる）。BGMだけ mp3 を鳴らす。 */
let ac = null, master = null, noiseBuf = null, bgm = null;
function initAudio() {
  if (ac) return;
  ac = new (window.AudioContext || window.webkitAudioContext)();
  master = ac.createGain(); master.gain.value = 0.9;
  const comp = ac.createDynamicsCompressor();  // 暴走で耳を痛めない天井
  comp.threshold.value = -6; comp.ratio.value = 20;
  master.connect(comp); comp.connect(ac.destination);
  // ホワイトノイズ（打撃のパチッ成分）を1本作って使い回す
  const n = ac.sampleRate * 0.3 | 0;
  noiseBuf = ac.createBuffer(1, n, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
}
function resumeAudio() { if (ac && ac.state === "suspended") ac.resume(); }

/* パシッ という打撃音。str=0〜1 で強さ（＝はたく速度） */
function playHit(str) {
  if (!ac) return;
  const t = ac.currentTime, v = 0.25 + 0.6 * Math.min(1, str);
  // 高域ノイズのアタック
  const ns = ac.createBufferSource(); ns.buffer = noiseBuf;
  const nf = ac.createBiquadFilter(); nf.type = "highpass"; nf.frequency.value = 1400;
  const ng = ac.createGain();
  ng.gain.setValueAtTime(v, t);
  ng.gain.exponentialRampToValueAtTime(0.0008, t + 0.09);
  ns.connect(nf); nf.connect(ng); ng.connect(master);
  ns.start(t); ns.stop(t + 0.12);
  // 低い胴鳴り（バチンの芯）
  const o = ac.createOscillator(); o.type = "triangle";
  o.frequency.setValueAtTime(200, t);
  o.frequency.exponentialRampToValueAtTime(70, t + 0.08);
  const og = ac.createGain();
  og.gain.setValueAtTime(v * 0.9, t);
  og.gain.exponentialRampToValueAtTime(0.0008, t + 0.13);
  o.connect(og); og.connect(master);
  o.start(t); o.stop(t + 0.15);
}

/* 正解のキラッ／お手つきのブブッ */
function playChime(good) {
  if (!ac) return;
  const t = ac.currentTime;
  const notes = good ? [523, 784, 1047] : [196, 165];
  notes.forEach((f, i) => {
    const o = ac.createOscillator(); o.type = good ? "sine" : "sawtooth";
    const g = ac.createGain();
    const st = t + i * (good ? 0.06 : 0.09);
    o.frequency.setValueAtTime(f, st);
    if (!good) o.frequency.exponentialRampToValueAtTime(f * 0.7, st + 0.18);
    g.gain.setValueAtTime(0.0001, st);
    g.gain.exponentialRampToValueAtTime(good ? 0.32 : 0.28, st + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0008, st + (good ? 0.35 : 0.22));
    o.connect(g); g.connect(master);
    o.start(st); o.stop(st + 0.4);
  });
}

/* 勝敗のジングル。win=明るい上昇ファンファーレ、lose=下降、draw=中間 */
function playResult(outcome) {
  if (!ac) return;
  const t0 = ac.currentTime;
  const seq = outcome === "win" ? [523, 659, 784, 1047, 1319]
            : outcome === "lose" ? [440, 392, 330, 262]
            : [523, 587];
  const wave = outcome === "lose" ? "triangle" : "sine";
  seq.forEach((f, i) => {
    const st = t0 + i * (outcome === "win" ? 0.13 : 0.18);
    const o = ac.createOscillator(); o.type = wave;
    o.frequency.setValueAtTime(f, st);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, st);
    g.gain.exponentialRampToValueAtTime(0.3, st + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0008, st + (outcome === "win" ? 0.5 : 0.42));
    o.connect(g); g.connect(master);
    o.start(st); o.stop(st + 0.6);
  });
  if (outcome === "win") {   // 最後にキラッと重ねる
    const st = t0 + seq.length * 0.13;
    [1047, 1319, 1568].forEach(f => {
      const o = ac.createOscillator(); o.type = "sine";
      o.frequency.value = f;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(0.22, st + 0.04);
      g.gain.exponentialRampToValueAtTime(0.0008, st + 0.7);
      o.connect(g); g.connect(master);
      o.start(st); o.stop(st + 0.8);
    });
  }
}

/* BGM。ユーザー操作の中でしか鳴らせないので開始ボタンから呼ぶ */

    bgm = new Audio("assets/bgm.mp3");
    bgm.loop = true; bgm.volume = 0.28;
  }
  bgm.play().catch(() => {});   // ファイルが無い/未DLでも他は動く
}
function stopBGM() { if (bgm) { try { bgm.pause(); bgm.currentTime = 0; } catch (e) {} } }

   UIの文言を日/英で切り替える。札の「漢字」はそのまま、読み札だけ英語では

const T = {

/* ひらがな → ローマ字（読み札を英語モードで表示するため） */
const KANA = {
  あ:"a",い:"i",う:"u",え:"e",お:"o",か:"ka",き:"ki",く:"ku",け:"ke",こ:"ko",
  さ:"sa",し:"shi",す:"su",せ:"se",そ:"so",た:"ta",ち:"chi",つ:"tsu",て:"te",と:"to",
  な:"na",に:"ni",ぬ:"nu",ね:"ne",の:"no",は:"ha",ひ:"hi",ふ:"fu",へ:"he",ほ:"ho",
  ま:"ma",み:"mi",む:"mu",め:"me",も:"mo",や:"ya",ゆ:"yu",よ:"yo",
  ら:"ra",り:"ri",る:"ru",れ:"re",ろ:"ro",わ:"wa",を:"o",ん:"n",
  が:"ga",ぎ:"gi",ぐ:"gu",げ:"ge",ご:"go",ざ:"za",じ:"ji",ず:"zu",ぜ:"ze",ぞ:"zo",
  だ:"da",ぢ:"ji",づ:"zu",で:"de",ど:"do",ば:"ba",び:"bi",ぶ:"bu",べ:"be",ぼ:"bo",
  ぱ:"pa",ぴ:"pi",ぷ:"pu",ぺ:"pe",ぽ:"po",
};
const YOON = { ゃ:"ya", ゅ:"yu", ょ:"yo" };
function toRomaji(s) {
  let out = "";
  for (let i = 0; i < s.length; i++) {
    const c = s[i], nx = s[i + 1];
    if (c === "っ") { const r = KANA[nx] || YOON[nx]; if (r) out += r[0]; continue; }
    if (c === "ー") { const m = out.match(/[aeiou]$/); if (m) out += m[0]; continue; }
    if (YOON[nx] && KANA[c]) {           // きゃ 等：子音 + ya/yu/yo（i段の "i" を落とす）
      let base = KANA[c];
      if (base.endsWith("i")) base = base.slice(0, -1);
      if (base === "sh" || base === "ch" || base === "j") out += base + YOON[nx].slice(1);
      else out += base + YOON[nx];
      i++; continue;
    }
    out += KANA[c] || c;
  }
  return out;
}
function readingText() {
  if (!answer) return "";
  return CFG.lang === "en" ? toRomaji(answer.yomi) : answer.yomi;

/* ================= 指の速度 =================
   つまむ動作は使わない。指先が札に「入った瞬間」が当たり判定で、
   そのときの速度ベクトルがそのまま札を吹き飛ばす力になる。 */
let vel = { x: 0, y: 0 };          // px/秒
const VEL_SMOOTH = 0.5;
const trail = [];                  // 指の軌跡（スワイプを画で見せる）
const TRAIL_MAX = 14;

function updateVel(p, prev, dt) {
  if (!prev || dt <= 0) return;
  const vx = (p.x - prev.x) / dt, vy = (p.y - prev.y) / dt;
  vel.x += (vx - vel.x) * VEL_SMOOTH;
  vel.y += (vy - vel.y) * VEL_SMOOTH;
}

function mapPt(n) {
  const vw = mir.width, vh = mir.height;
  if (!W || !H || !vw || !vh) return { x: W / 2, y: H / 2 };
  const s = Math.max(W / vw, H / vh);
  const dw = vw * s, dh = vh * s;
  return { x: n.x * dw - (dw - W) / 2, y: n.y * dh - (dh - H) / 2 };
}
const SMOOTH = 0.4;
let sm = null;
function follow(p) {
  if (!sm) { sm = { x: p.x, y: p.y }; return sm; }
  if (Math.hypot(p.x - sm.x, p.y - sm.y) > Math.hypot(W, H) * 0.22) { sm.x = p.x; sm.y = p.y; }
  else { sm.x += (p.x - sm.x) * SMOOTH; sm.y += (p.y - sm.y) * SMOOTH; }
  return sm;
}

/* ================= 通信 ================= */
const PREFIX = "kanjikaruta-v1-";
let peer = null, conn = null, isHost = false, mode = "solo"; // solo | net
let myStream = null;

function send(o) { if (conn && conn.open) { try { conn.send(o); } catch (e) {} } }

function wireConn(c) {
  conn = c;
  c.on("data", onData);
  c.on("close", () => { if (playing) endGame(null, tt("disc")); });
  c.on("error", () => {});
  c.on("open", () => {
    if (isHost) {
      send({ t: "cfg", level: CFG.level, genre: CFG.genre });
      say(tt("connected"));
      setTimeout(() => startGame("net"), 700);
    } else {
      say(tt("waitHost"));
    }
  });
}

function initPeer(id) {
  return new Promise((res, rej) => {
    peer = new Peer(id || undefined, { debug: 0 });
    peer.on("open", pid => res(pid));
    peer.on("error", e => rej(e));
    peer.on("connection", c => { if (isHost) wireConn(c); });
    peer.on("call", call => {
      call.answer(myStream || undefined);
      call.on("stream", s => { opVid.srcObject = s; });
    });
  });
}

function callPeer(otherId) {
  if (!peer) return;
  const call = peer.call(otherId, myStream || new MediaStream());
  if (!call) return;
  call.on("stream", s => { opVid.srcObject = s; });
}

function onData(m) {
  if (m.t === "cfg") { CFG.level = m.level; CFG.genre = m.genre; }
  else if (m.t === "round") { applyRound(m); }
  else if (m.t === "claim" && isHost) { resolveClaim(m.cardId, "op"); }
  else if (m.t === "result") { applyResult(m); }
  else if (m.t === "ptr") { opPtrN = { x: m.x, y: m.y }; opPtrSp = m.sp || 0; opPtrT = performance.now(); }
  else if (m.t === "over") { endGame(m.outcome || "draw"); }
}

let playing = false, answer = null, qn = 0;

let freezeUntil = 0, roundLocked = false, armedAt = 0;
let flash = null, cpuAt = Infinity;
let cpuTarget = null, cpuWrong = false, cpuPtr = null;   // 練習モードの相手の手
let opPtrN = null, opPtrSp = 0, opPtrT = 0, lastPtrSent = 0;   // オンラインの相手の指（正規化座標）

function pool() {
  return DECK.filter(d => d.lv === CFG.level && (CFG.genre === "all" || d.g === CFG.genre));
}
function pick(arr, n) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, n);
}

function newRound() {
  const p = pool();
  const n = Math.min(CARDS_BY_LV[CFG.level] || 6, p.length);
  const sel = pick(p, n);
  const ans = sel[(Math.random() * sel.length) | 0];
  // sel はシャッフル済み。前半をホスト陣、後半をゲスト陣に割り振る（＝上下に分ける）
  const half = Math.ceil(n / 2);
  const m = {
    t: "round", n: qn + 1,
    cards: sel.map((d, i) => ({ id: i, k: d.k, owner: i < half ? "host" : "guest" })),
    yomi: ans.y, answerId: sel.indexOf(ans),
  };
  applyRound(m);
  send(m);
}

function applyRound(m) {
  qn = m.n;
  cards = m.cards.map(c => ({
    id: c.id, k: c.k, x: 0, y: 0, w: 0, h: 0,
    fly: false, vx: 0, vy: 0, rot: 0, rotv: 0, a: 1, inside: false,
    // owner はホスト視点。自分の陣（下半分）かどうかを local 視点に直す
    owner: c.owner || "host",
    me: isHost ? (c.owner || "host") === "host" : (c.owner || "host") === "guest",
  }));
  answer = { id: m.answerId, yomi: m.yomi };
  roundLocked = false; flash = null;
  opPtrN = null;
  // 札が並んだ直後に指が乗っていても暴発させない
  armedAt = performance.now() + 500;
  layoutCards();
  qnEl.textContent = tt("round", qn);
  // CPUの手（練習モード）。dt はクランプされるので実時間で持つ
  const delay = { 1: 4.2, 2: 3.4, 3: 2.8 }[CFG.level] || 3.5;
  if (mode === "solo") {
    cpuAt = performance.now() + (delay + Math.random() * 2.5) * 1000;
    cpuWrong = Math.random() < 0.25;
    const cand = cards.filter(c => cpuWrong ? c.id !== answer.id : c.id === answer.id);
    cpuTarget = cand[(Math.random() * cand.length) | 0] || null;
    cpuPtr = { x: W / 2, y: H * 0.14 };   // 上から降りてくる
  } else {
    cpuAt = Infinity; cpuTarget = null;
  }
}

/* 上下2分割レイアウト。相手の札は上半分、自分の札は下半分。
   自分の札は下＝自分の指が届きやすい＝有利。読み札は中央の帯に置く。 */
const BAND_H = 62;   // 中央の読み札帯の高さ
function layoutRow(list, centerY, availW) {
  const k = list.length; if (!k) return;
  const GAP = 14;
  const cw = Math.min(130, (availW - (k - 1) * GAP) / k);
  const ch = Math.min(158, cw * 1.28);
  const rowW = k * cw + (k - 1) * GAP;
  list.forEach((c, i) => {
    c.w = cw; c.h = ch;
    c.hx = (W - rowW) / 2 + i * (cw + GAP);
    c.hy = centerY - ch / 2;
    if (!c.fly) { c.x = c.hx; c.y = c.hy; }
  });
}
function layoutCards() {
  if (!cards.length || !W || !H) return;
  const availW = W - 28;
  const midY = H / 2;
  const topZ = [120, midY - BAND_H / 2 - 8];          // 相手ゾーン（上）
  const botZ = [midY + BAND_H / 2 + 8, H - 40];        // 自分ゾーン（下）
  const opC = cards.filter(c => !c.me);
  const meC = cards.filter(c => c.me);
  layoutRow(opC, (topZ[0] + topZ[1]) / 2, availW);
  layoutRow(meC, (botZ[0] + botZ[1]) / 2, availW);
}

/* ---- 吹き飛ばす ----
   指がぶつかった瞬間の速度ベクトルをそのまま札の初速にする。
   遅く触れても札が動かないと当たった感が出ないので、下限をつける。 */
const FLING_MIN = 900, FLING_MAX = 4200, GRAVITY = 1600;
function launch(c, vx, vy) {
  if (!c || c.fly) return;
  let sp = Math.hypot(vx, vy);
  if (sp < 1) { vx = 0; vy = -1; sp = 1; }          // ほぼ静止 → 上に弾く
  const k = Math.min(FLING_MAX, Math.max(FLING_MIN, sp * 1.35)) / sp;
  c.fly = true;
  c.vx = vx * k; c.vy = vy * k;
  // 指の角度ぶんスピンさせる。横に払えば大きく回る
  c.rotv = (c.vx / 900) * (1.6 + Math.random() * 1.2) * (c.vy < 0 ? 1 : -1);
  c.a = 1;
  playHit(sp / 2500);   // はたいた瞬間のパシッ。速いほど強い
}

/* ---- 取る ---- */
function claim(cardId) {
  if (roundLocked || !playing) return;
  if (performance.now() < freezeUntil) return;
  if (mode === "net" && !isHost) { send({ t: "claim", cardId }); return; }
  resolveClaim(cardId, "me");
}

function resolveClaim(cardId, who) {
  if (roundLocked) return;
  const ok = cardId === answer.id;
  if (ok) roundLocked = true;
  const m = { t: "result", cardId, who, ok };
  applyResult(m);
  if (mode === "net") send({ t: "result", cardId, who: who === "me" ? "op" : "me", ok });
}

function applyResult(m) {
  const who = m.who;
  // 自分の手はぶつかった瞬間にもう飛ばしてある。相手の手・キーボードはここで飛ばす
  const c = cards.find(c => c.id === m.cardId);
  if (c && !c.fly) {
    const ang = -Math.PI / 2 + (Math.random() - 0.5) * 1.6;
    launch(c, Math.cos(ang) * 1800, Math.sin(ang) * 1800);
  }
  if (m.ok) {
    score[who] += 3;
    roundLocked = true;
    flash = { text: who === "me" ? tt("gotIt") : tt("taken"), good: who === "me", t: 0 };
    playChime(true);
    setTimeout(nextRound, 1500);
  } else {
    score[who] -= 2;
    if (who === "me") freezeUntil = performance.now() + 1500;
    flash = { text: who === "me" ? tt("missMe") : tt("missOp"), good: false, t: 0 };
    playChime(false);
  }
  scMe.textContent = score.me; scOp.textContent = score.op;
}

function nextRound() {
  if (!playing) return;
  if (mode === "net" && !isHost) return;   // ホストが配る
  if (qn >= ROUNDS) {
    const my = score.me === score.op ? "draw" : (score.me > score.op ? "win" : "lose");
    // 相手には勝敗を反転して送る
    if (mode === "net") send({ t: "over", outcome: my === "win" ? "lose" : (my === "lose" ? "win" : "draw") });
    endGame(my);
    return;
  }
  newRound();
}

/* outcome: "win"|"lose"|"draw" → リザルト画面。null → 中断/切断でメニューへ */
function endGame(outcome, note) {
  playing = false;
  cards = []; trail.length = 0;
  hud.style.display = "none";
  stopBGM();
  if (conn) { try { conn.close(); } catch (e) {} conn = null; }
  if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }

  if (outcome === "win" || outcome === "lose" || outcome === "draw") {
    showResult(outcome);
  } else {
    gate.classList.remove("hidden");
    if (note) say(note);
  }
}

function showResult(outcome) {

  $("rSub").textContent = tt(outcome);

  // 紙吹雪（勝ちのみCSSで表示）
  [...r.querySelectorAll(".confetti")].forEach(n => n.remove());
  if (outcome === "win") {
    const cols = ["#6fe3a6", "#7fd6a2", "#ffd36f", "#ff9f6f", "#8fb7ff"];
    for (let i = 0; i < 40; i++) {
      const d = document.createElement("div");
      d.className = "confetti";
      d.style.left = (Math.random() * 100) + "vw";
      d.style.background = cols[(Math.random() * cols.length) | 0];
      d.style.animationDuration = (1.6 + Math.random() * 1.6) + "s";
      d.style.animationDelay = (Math.random() * 0.6) + "s";
      r.appendChild(d);
    }
  }
  playResult(outcome);
}

$("rMenu").addEventListener("click", () => {
  $("result").classList.add("hidden");
  gate.classList.remove("hidden");
});
$("rAgain").addEventListener("click", () => {
  $("result").classList.add("hidden");
  if (lastMode === "solo") { isHost = true; startGame("solo"); }
  else gate.classList.remove("hidden");   // オンラインは相手待ちが要るのでメニューへ
});
$("quit").addEventListener("click", () => endGame(null, tt("aborted")));

/* ================= ボタン ================= */
$("bSolo").addEventListener("click", async () => {
  initAudio(); resumeAudio();   // 音はユーザー操作の中で解禁する
  // 練習はカメラが無くても始める。手が映らない間はマウスが指の代わりになる
  try { await openCamera(); } catch (e) {
    say(tt("camNG", e.name));
  }
  isHost = true; startGame("solo");
});

$("bHost").addEventListener("click", async () => {
  initAudio(); resumeAudio();
  try { await openCamera(); } catch (e) { return say("カメラを開始できません: " + e.message, true); }
  isHost = true;
  const code = Math.random().toString(36).slice(2, 6).toUpperCase();
  try {
    await initPeer(PREFIX + code);
    say(tt("codeAsk", code));
  } catch (e) { say("Room error: " + (e.message || e), true); }
});

$("bJoin").addEventListener("click", async () => {
  initAudio(); resumeAudio();
  const code = $("code").value.trim().toUpperCase();
  if (code.length !== 4) return say(tt("code4"), true);
  try { await openCamera(); } catch (e) { return say("Camera error: " + e.message, true); }
  isHost = false;
  try {
    await initPeer(null);
    say(tt("connecting"));
    wireConn(peer.connect(PREFIX + code, { reliable: true }));
    setTimeout(() => { if (CFG.face === "on") callPeer(PREFIX + code); }, 900);
    setTimeout(() => {
      if (playing) return;
      if (conn && conn.open) startGame("net");
      else say(tt("noRoom"), true);
    }, 2500);
  } catch (e) { say("Join error: " + (e.message || e), true); }
});

/* キーボード操作 */
addEventListener("keydown", e => {
  if (!playing || CFG.input !== "key") return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= cards.length) {
    const c = cards[n - 1];
    if (c && !c.fly) claim(c.id);
  }
});


/* ================= 描画 ================= */
/* 映像を指定した矩形に cover で敷く。mirror=true で鏡像（自撮り用） */
function coverDraw(srcEl, dx, dy, dw, dh, mirror, filter) {
  const sw = srcEl.videoWidth | 0, sh = srcEl.videoHeight | 0;
  if (!sw || !sh) return false;
  const s = Math.max(dw / sw, dh / sh), rw = sw * s, rh = sh * s;
  vctx.save();
  vctx.beginPath(); vctx.rect(dx, dy, dw, dh); vctx.clip();
  vctx.filter = filter || "grayscale(.85) brightness(.32)";
  if (mirror) { vctx.translate(dx + dw, dy); vctx.scale(-1, 1); vctx.translate(-dx, -dy); }
  vctx.drawImage(srcEl, dx + (dw - rw) / 2, dy + (dh - rh) / 2, rw, rh);
  vctx.restore();
  return true;
}

/* 上=相手 / 下=自分 の分割背景。区切り線とラベルも描く */
function drawBG() {
  vctx.fillStyle = "#07090c";
  vctx.fillRect(0, 0, W, H);
  const midY = H / 2;

  // 下半分：自分のカメラ（鏡像）
  if (camOn) coverDraw(vid, 0, midY, W, H - midY, true);

  // 上半分：相手。顔出しなら映像、隠しているなら暗いまま（指の点だけ出す）
  if (mode === "net") {
    const drew = coverDraw(opVid, 0, 0, W, midY, false);
    if (!drew) {
      vctx.fillStyle = "#0b0f14"; vctx.fillRect(0, 0, W, midY);
    }
  } else {
    vctx.fillStyle = "#0a0d12"; vctx.fillRect(0, 0, W, midY);
  }

  // 区切り線
  vctx.save();
  vctx.strokeStyle = "rgba(255,255,255,.14)"; vctx.lineWidth = 1;
  vctx.setLineDash([10, 8]);
  vctx.beginPath(); vctx.moveTo(0, midY); vctx.lineTo(W, midY); vctx.stroke();
  vctx.setLineDash([]);
  // 陣地ラベル
  vctx.font = "600 11px 'Hiragino Sans', sans-serif"; vctx.textAlign = "left";
  vctx.fillStyle = "rgba(255,159,111,.7)"; vctx.fillText(tt("opZone"), 14, 30 + 0);
  vctx.fillStyle = "rgba(111,227,166,.7)"; vctx.fillText(tt("meZone"), 14, H - 30);
  vctx.restore();
}

/* 中央の帯に読み札（両者が読める位置） */
function drawQuestion() {
  if (!answer) return;
  const midY = H / 2, bw = Math.min(360, W - 40), bh = BAND_H;
  vctx.save();
  vctx.beginPath();
  vctx.roundRect((W - bw) / 2, midY - bh / 2, bw, bh, 14);
  vctx.fillStyle = "rgba(9,12,17,.82)";
  vctx.fill();
  vctx.lineWidth = 1; vctx.strokeStyle = "rgba(127,214,162,.35)"; vctx.stroke();
  vctx.textAlign = "center"; vctx.textBaseline = "middle";
  vctx.fillStyle = "#7fd6a2";
  const rd = readingText();
  vctx.font = "600 " + Math.min(34, (bw * 0.9) / Math.max(3, rd.length) * 1.7) + "px 'Hiragino Sans', sans-serif";
  vctx.fillText(rd, W / 2, midY + 1);
  vctx.restore();
}

/* 相手の手のマーカー（オンライン＝通信で来た指位置／練習＝CPUの手） */
function drawOpp() {
  let x, y;
  if (mode === "net") {
    if (!opPtrN || performance.now() - opPtrT > 1200) return;
    // 相手の下半分＝こちらの上半分。左右も上下も反転して向かい合わせにする
    x = (1 - opPtrN.x) * W; y = (1 - opPtrN.y) * H;
  } else if (mode === "solo") {
    if (!cpuPtr) return; x = cpuPtr.x; y = cpuPtr.y;
  } else return;
  vctx.save();
  vctx.beginPath(); vctx.arc(x, y, 12, 0, Math.PI * 2);
  vctx.fillStyle = "rgba(255,159,111,.85)"; vctx.fill();
  vctx.lineWidth = 2; vctx.strokeStyle = "rgba(255,255,255,.85)"; vctx.stroke();
  vctx.restore();
}

/* 飛んでいる札の物理。指の速度がそのまま初速、あとは重力と空気抵抗にまかせる */
function updateCards(dt) {
  for (const c of cards) {
    if (!c.fly || c.a <= 0) continue;
    c.vy += GRAVITY * dt;
    const drag = 1 - Math.min(0.9, 0.7 * dt);
    c.vx *= drag; c.vy *= drag;
    c.x += c.vx * dt; c.y += c.vy * dt;
    c.rot += c.rotv * dt;
    c.a = Math.max(0, c.a - dt * 1.15);
  }
}

function drawCards(pt) {
  const frozen = performance.now() < freezeUntil;
  cards.forEach((c, i) => {
    if (c.a <= 0) return;
    const near = !frozen && !c.fly && pt && inCard(c, pt);
    vctx.save();
    vctx.globalAlpha = c.a;
    vctx.translate(c.x + c.w / 2, c.y + c.h / 2);
    if (c.fly) { vctx.rotate(c.rot); vctx.shadowColor = "rgba(0,0,0,.55)"; vctx.shadowBlur = 30; }
    vctx.beginPath();
    vctx.roundRect(-c.w / 2, -c.h / 2, c.w, c.h, 14);
    vctx.fillStyle = near ? "#fffdf4" : "#e9e5da";
    vctx.fill();
    vctx.lineWidth = near ? 3 : 1;
    vctx.strokeStyle = near ? "#7fd6a2" : "rgba(0,0,0,.18)";
    vctx.stroke();
    vctx.fillStyle = "#14171b";
    const fs = Math.min(c.h * 0.42, (c.w * 0.78) / Math.max(1, c.k.length) * 1.15);
    vctx.font = "600 " + fs + "px 'Hiragino Mincho ProN', 'Yu Mincho', serif";
    vctx.textAlign = "center"; vctx.textBaseline = "middle";
    vctx.fillText(c.k, 0, 4);
    if (CFG.input === "key" && !c.fly) {
      vctx.fillStyle = "rgba(0,0,0,.35)";
      vctx.font = "600 13px sans-serif"; vctx.textBaseline = "alphabetic";
      vctx.fillText(String(i + 1), -c.w / 2 + 16, -c.h / 2 + 24);
    }
    vctx.restore();
  });
}

/* 指の軌跡。速く払っているほど尾が伸びて光る＝はたいた感が画で出る */
function drawPointer(pt, seen) {
  if (CFG.input !== "hand") return;
  const frozen = performance.now() < freezeUntil;
  const sp = Math.hypot(vel.x, vel.y);
  const hot = Math.min(1, sp / 2200);

  if (trail.length > 1) {
    vctx.save();
    vctx.lineCap = "round"; vctx.lineJoin = "round";
    for (let i = 1; i < trail.length; i++) {
      const t = i / trail.length;
      vctx.beginPath();
      vctx.moveTo(trail[i - 1].x, trail[i - 1].y);
      vctx.lineTo(trail[i].x, trail[i].y);
      vctx.lineWidth = 2 + t * (4 + hot * 12);
      vctx.strokeStyle = "rgba(111,227,166," + (t * (0.12 + hot * 0.5)).toFixed(3) + ")";
      vctx.stroke();
    }
    vctx.restore();
  }
  if (!seen || !pt) return;
  vctx.save();
  vctx.beginPath();
  vctx.arc(pt.x, pt.y, 9 + hot * 9, 0, Math.PI * 2);
  vctx.fillStyle = frozen ? "rgba(255,120,120,.5)" : "rgba(111,227,166," + (0.45 + hot * 0.5) + ")";
  vctx.fill();
  vctx.lineWidth = 2; vctx.strokeStyle = "rgba(255,255,255,.9)"; vctx.stroke();
  vctx.restore();
}

function drawFlash(dt) {
  if (!flash) return;
  flash.t += dt;
  if (flash.t > 1.5) { flash = null; return; }
  const a = Math.min(1, flash.t * 6) * Math.max(0, 1 - (flash.t - 1.0) / 0.5);
  vctx.save();
  vctx.globalAlpha = a;
  vctx.textAlign = "center";
  vctx.fillStyle = flash.good ? "#6fe3a6" : "#ff8b6f";
  vctx.font = "600 " + Math.min(44, W * 0.09) + "px 'Hiragino Sans', sans-serif";
  vctx.fillText(flash.text, W / 2, H / 2);
  vctx.restore();
}

function drawFrozen() {
  const left = (freezeUntil - performance.now()) / 1000;
  if (left <= 0) return;
  vctx.save();
  vctx.textAlign = "center";
  vctx.fillStyle = "rgba(255,139,111,.85)";
  vctx.font = "600 15px 'Hiragino Sans', sans-serif";
  vctx.fillText(tt("frozen", left.toFixed(1)), W / 2, H - 20);
  vctx.restore();
}

function inCard(c, p) {
  return p.x > c.x && p.x < c.x + c.w && p.y > c.y && p.y < c.y + c.h;
}

/* ================= ループ ================= */
let last = performance.now(), handSeen = false;
const mouse = { x: 0, y: 0, t: -1e9 };
addEventListener("mousemove", e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.t = performance.now(); });

function loop(now) {
  if (!playing) return;
  requestAnimationFrame(loop);

  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0.016;
  dt = Math.min(dt, 0.05);

  if (window.innerWidth !== W || window.innerHeight !== H) resize();
  if (!W || !H) return;

  // 練習モードのCPU：手（点）を狙う札へ寄せていき、時間が来たら はたく
  if (mode === "solo" && cpuPtr && cpuTarget && !cpuTarget.fly && !roundLocked) {
    const tx = cpuTarget.x + cpuTarget.w / 2, ty = cpuTarget.y + cpuTarget.h / 2;
    cpuPtr.x += (tx - cpuPtr.x) * Math.min(1, dt * 3.5);
    cpuPtr.y += (ty - cpuPtr.y) * Math.min(1, dt * 3.5);
  }
  if (mode === "solo" && !roundLocked && cards.length && now >= cpuAt) {
    cpuAt = Infinity;
    const c = cpuTarget && !cpuTarget.fly ? cpuTarget : null;
    if (c) {
      applyResult({ cardId: c.id, who: "op", ok: c.id === answer.id });
      if (c.id !== answer.id) {   // お手つき → 少し待って正解を狙い直す
        cpuAt = now + 2500;
        cpuWrong = false;
        cpuTarget = cards.find(k => k.id === answer.id) || null;
      }
    }
  }

  let pt = sm;
  handSeen = false;

  if (CFG.input === "hand" && camOn && handLandmarker && mir.width && vid.readyState >= 2) {
    mctx.save();
    mctx.translate(mir.width, 0); mctx.scale(-1, 1);
    mctx.drawImage(vid, 0, 0, mir.width, mir.height);
    mctx.restore();
    const res = handLandmarker.detectForVideo(mir, now);
    const lm = res && res.landmarks && res.landmarks[0];
    handSeen = !!lm;
    if (lm) {
      const prev = sm ? { x: sm.x, y: sm.y } : null;
      pt = follow(mapPt(lm[INDEX_TIP]));
      updateVel(pt, prev, dt);
      trail.push({ x: pt.x, y: pt.y });
    } else {
      vel.x = 0; vel.y = 0;
    }
  }

  // 手が映っていないときはマウスが指の代わりになる（カメラ無しのPCでも遊べる）
  if (CFG.input === "hand" && !handSeen && now - mouse.t < 900) {
    const prev = sm ? { x: sm.x, y: sm.y } : null;
    pt = follow({ x: mouse.x, y: mouse.y });
    updateVel(pt, prev, dt);
    trail.push({ x: pt.x, y: pt.y });
    handSeen = true;
  }
  while (trail.length > TRAIL_MAX) trail.shift();
  if (!handSeen && trail.length) trail.shift();

  // オンラインは自分の指位置を相手に送る（正規化・間引き）。相手はこれを上半分に映す
  if (mode === "net" && pt && now - lastPtrSent > 45) {
    lastPtrSent = now;
    send({ t: "ptr", x: pt.x / W, y: pt.y / H, sp: Math.hypot(vel.x, vel.y) });
  }

  /* ---- 当たり判定 ----
     指先が札の外から中へ「入った瞬間」だけ成立する。
     中に居続けても連打にならないので、指を置きっぱなしにしても暴発しない。 */
  if (CFG.input === "hand") {
    const canHit = !roundLocked && now > armedAt && now >= freezeUntil;
    for (const c of cards) {
      if (c.fly) { c.inside = false; continue; }
      const on = (handSeen && pt) ? inCard(c, pt) : false;
      const entered = on && !c.inside;
      c.inside = on;
      if (entered && canHit) { launch(c, vel.x, vel.y); claim(c.id); break; }
    }
  }

  updateCards(dt);

  drawBG();
  drawCards(pt);
  drawQuestion();
  drawOpp();
  drawFrozen();
  drawPointer(pt, handSeen);
  drawFlash(dt);

  dbg.textContent = CFG.input === "hand"
    ? (handSeen ? tt("hintHandOn") : tt("hintHandOff")) + "   " + tt("hintSpeed") + " " + Math.hypot(vel.x, vel.y).toFixed(0)
    : tt("hintKey", cards.length);
}
</script>
